name: $(Rev:r)

trigger:
  branches:
    include:
      - master
      - providers
      - fdps
      - releases/*
  paths:
    include:
      - CalculateFunding.Api.Profiling
      - CalculateFunding.Functions.Profiling
      - CalculateFunding.Services.Profiling
      - CalculateFunding.Services.Core
      - CalculateFunding.Api.Profiling.UnitTests
      - CalculateFunding.Services.Profiling.UnitTests
      - CalculateFunding.Profiling.GWTs

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: self

variables:
  - name: ProjectName
    value: Profiling

  - name: ServiceName
    value: Profiling

  - name: templateName
    value: profiling

  - name: releaseconfiguration
    value: Release

  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true

  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true

  - name: BuildApi
    value: true

  - name: BuildFunction
    value: false

  - name: SecureSmokeTest
    value: true

  - name: runIntegrationTests
    value: true

  # Docker / ACR
  - name: acrName
    value: cfsdevsharedacr

  - name: acrLoginServer
    value: cfsdevsharedacr.azurecr.io

  - name: dockerRegistryServiceConnection
    value: CFS-DEV-ACR

  - name: imageTag
    value: $(Build.BuildId)

  - name: patToken
    value: $(System.AccessToken)

  # Variable Groups
  - group: Dotnet Core SDK Version
  - group: Azure Settings Integration-v2
  - group: Integration Tests Info - Integration-PR
  - group: Integration Tests KV - Integration-PR
  - group: Shared Infrastructure - Integration - v2
  - group: Resource Tags test-v2 integration-v2
  - group: Feature Toggles Integration-v2

stages:
  # ==================================================
  # STAGE 1 - BUILD & PUSH DOCKER IMAGE(S)
  # ==================================================
  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: DockerBuild
        displayName: Build Docker Images
        condition: succeeded()
        steps:
          - task: Docker@2
            displayName: Build API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: profiling-api
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Api.Profiling/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: profiling-api
              tags: |
                $(imageTag)
                latest

  # ==================================================
  # STAGE 2 - PR INFRA + DEPLOY
  # ==================================================
  - stage: PR_Infra
    displayName: Deploy PR Infrastructure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployInfra
        steps:
          - template: templates/standard-service-arm-deploy-linux.yml
            parameters:
              ServiceName: ${{ variables.ServiceName }}
              templateName: ${{ variables.templateName }}
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              overrideParameters: '-environmentKey "$(EnvironmentKey)" -productVersion "pr" -appServiceLogRetentionDays "0" -sendWebLogsToStorage "false" -apiHostingPlanName "$(apiHostingPlanNamePR)" -keyVaultName "$(keyVaultNamePR)" -sharedLogStorageName "$(sharedLogStorageName)" -environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -applicationInsightsName "$(applicationInsightsName)" -azureAdTenantId "$(azureAdTenantId)" -azureAdAudienceProfiling "$(azureAdAudienceProfiling)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -appSrvSubnetName "$(appSrvSubnetNamePR)" -intProfilingAStoVNet "true" -funcsSubnetName "$(funcsSubnetNamePR)" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)" -ipSecurityRestrictionsEnabled "false" -UseSQLDB "false"'

          - template: templates/standard-service-pr-ci-build-prinfra-linux.yml
            parameters:
              ProjectName: ${{ variables.ProjectName }}
              ServiceName: ${{ variables.ServiceName }}
              DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
              ApiFrameworkVersion: net8.0
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              environmentKey: $(EnvironmentKey)
              ServiceBusSettings: $(ServiceBusSettingsPR)
              BuildApi: ${{ variables.BuildApi }}
              BuildFunction: ${{ variables.BuildFunction }}
              SecureSmokeTest: ${{ variables.SecureSmokeTest }}
              SmokeTestTenantId: $(SmokeTestTenantId)
              SmokeTestApplicationUrl: $(SmokeTestApplicationUrl-profiling)
              SmokeTestClientID: $(SmokeTestClientId-profiling)
              SmokeTestClientSecret: $(ProfilingAzureAdClientSecret)

  # ==================================================
  # STAGE 3 - INTEGRATION TESTS
  # ==================================================
  - stage: IntegrationTests
    displayName: Run Integration Tests
    dependsOn: PR_Infra
    condition: and(
      succeeded(),
      eq(variables['Build.Reason'], 'PullRequest'),
      eq(variables['runIntegrationTests'], 'true')
      )
    jobs:
      - job: RunTests
        steps:
          # ✅ Restore using private feed because Those packages are not public NuGet packages. They're internal CalculateFunding packages hosted in your Azure DevOps Artifacts feed.
          - task: DotNetCoreCLI@2
            displayName: Restore Integration Test Projects
            inputs:
              command: restore
              projects: |
                **/*Api.Profiling.IntegrationTests/*.csproj
              feedsToUse: select
              vstsFeed: 'ecf37bc0-472b-47bf-91e3-6774809fd194'

          - task: DotNetCoreCLI@2
            displayName: dotnet test for Integration tests
            condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), eq(variables['runIntegrationTests'], 'true'))
            inputs:
              command: test
              projects: |
                **/*Api.Profiling.IntegrationTests/*.csproj
              arguments: '--configuration Release /p:AssemblyVersion=$(Build.BuildNumber)'
            env:
              AzureAd__Audience: $(AzureAdAudienceprofiling)
              AzureAd__Authority: $(AzureAdAuthority)
              AzureAd__TenantId: $(AzureAdTenantId)
              AzureConfiguration__ConnectionString: $(AzureConfigurationConnectionString)
              AzureStorageSettings__ConnectionString: $(AzureStorageSettings)
              CosmosDbSettings__ConnectionString: $(CosmosDbSettings)
              CosmosDbSettings__ContainerName: profiling
              CosmosDbSettings__DatabaseName: $(CosmosDbSettingsDatabaseName)
              RedisSettings__CacheConnection: $(RedisSettings)
              ResourceGroup: $(ResourceGroup)
              ServiceBusSettings__ConnectionString: $(ServiceBusSettingsPR)
              storageConfiguration__ConnectionString: $(AzureStorageSettings)
              providerProfilingClient__ApiEndpoint: $(providerProfilingClientApiEndpoint)
              providerProfilingClient__ApiKey: $(svcapiprofiling)
              providerProfilingAzureBearerTokenOptions__ClientId: $(providerProfilingAzureBearerTokenOptionsClientId)
              providerProfilingAzureBearerTokenOptions__ClientSecret: $(providerProfilingAzureBearerTokenClientSecret)
              providerProfilingAzureBearerTokenOptions__GrantType: client_credentials
              providerProfilingAzureBearerTokenOptions__Scope: $(providerProfilingAzureBearerTokenOptionsScope)
              providerProfilingAzureBearerTokenOptions__Url: $(providerProfilingAzureBearerTokenOptionsUrl)

          - task: AzureCLI@2
            condition: and(failed(), eq(variables['Build.Reason'], 'PullRequest'))
            displayName: Reset in-progress swap on failure
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: 'az webapp deployment slot swap --action reset --slot Staging --name app-$(EnvironmentKey)-${{ variables.ServiceName }}-pr --resource-group $(ResourceGroup)'