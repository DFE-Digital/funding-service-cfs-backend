name: $(Rev:r)

pool:
  vmImage: ubuntu-latest

trigger:
  branches:
    include:
    - master
    - providers
    - fdps
    - releases/*
  paths:
    include:
    - CalculateFunding.Api.External
    - CalculateFunding.Functions.External
    - CalculateFunding.Services.External
    - CalculateFunding.Services.External.UnitTests
    - CalculateFunding.Services.Core
    - CalculateFunding.Api.External.UnitTests
    - DevOps/search-indexers/publishedfundingindexer
    - DevOps/search-indexes/publishedfundingindex
    - CalculateFunding.Models.Publishing
    - CalculateFunding.Services.Publishing
    - CalculateFunding.Models.Search

variables:
 - name: ProjectName
   value: 'External'
 - name: ServiceName
   value: 'External'
 - name: templateName
   value: external
 - name: releaseconfiguration
   value: 'release'
 - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
   value: true
 - name: DOTNET_CLI_TELEMETRY_OPTOUT 
   value: true
 - name: BuildApi
   value: true
 - name: BuildFunction
   value: false
 - name: SecureSmokeTest
   value: true

 # Docker / ACR
 - name: acrName
   value: cfsdevsharedacr
 
 - name: acrLoginServer
   value: cfsdevsharedacr.azurecr.io
 
 - name: dockerRegistryServiceConnection
   value: CFS-DEV-ACR
 
 - name: imageTag
   value: $(Build.BuildId)
 
 - name: patToken
   value: $(System.AccessToken)
 
 # Variable Groups   
 - group: 'Dotnet Core SDK Version'
 - group: 'Azure Settings Integration-v2'
 - group: 'Integration Tests Info - Integration-PR' 
 - group: 'Integration Tests KV - Integration-PR'
 - group: 'Shared Infrastructure - Integration - v2'
 - group: 'Resource Tags test-v2 integration-v2'
 - group: 'Feature Toggles Integration-v2'

# ==================================================
# STAGE 1 - BUILD & PUSH DOCKER IMAGES
# ==================================================

stages:
- stage: Build
  displayName: Build and Push Images

  jobs:
  - job: DockerBuild
    displayName: Build Docker Images
    condition: succeeded()
    steps:
    - task: Docker@2
      displayName: Build API Image
      condition: eq(variables['BuildApi'], 'true')
      inputs:
        command: build
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: external-api
        Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Api.External/Dockerfile
        buildContext: $(Build.SourcesDirectory)
        arguments: >
          --build-arg FEED_PAT=$(patToken)
        tags: |
          $(imageTag)
          latest

    - task: Docker@2
      displayName: Push API Image
      condition: eq(variables['BuildApi'], 'true')
      inputs:
        command: push
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: external-api
        tags: |
          $(imageTag)
          latest

# ==================================================
# STAGE 2 - PR INFRA + DEPLOY
# ==================================================

- stage: PR_Infra
  displayName: Deploy PR Infrastructure
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployInfra

    steps:
     - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
       - template: templates\standard-service-arm-deploy-linux.yml
         parameters:
           ServiceName: ${{ variables.ServiceName }}
           ResourceGroup: $(ResourceGroup)
           azureSubscription: $(azureSubscription)
           templateName : $(templateName)
           overrideParameters: '-environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -environmentKey "$(EnvironmentKey)" -productVersion "pr" -appServiceLogRetentionDays "0" -sendWebLogsToStorage "false" -apiHostingPlanName "$(apiHostingPlanNamePR)" -keyVaultName "$(keyVaultNamePR)" -sharedLogStorageName "$(sharedLogStorageName)" -searchName "$(searchName)" -azureAdTenantId "$(AzureAdTenantId)" -azureAdAudienceExternal "$(AzureAdAudienceExternal)" -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -applicationInsightsName "$(applicationInsightsName)" -addCerttoExternalAppService "false" -externalApiCertificateThumbprint "not-applicable" -externalApiCertName "not-applicable" -externalApiHostName "not-applicable" -providerProfilingApiUrl "$(providerProfilingClientApiEndpoint)" -providerProfilingAzureBearerTokenClientId "$(providerProfilingAzureBearerTokenOptionsClientId)" -providerProfilingAzureBearerTokenGrantType "client_credentials" -providerProfilingAzureBearerTokenScope "$(providerProfilingAzureBearerTokenOptionsScope)" -providerProfilingAzureBearerTokenUrl "$(providerProfilingAzureBearerTokenOptionsUrl)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -appSrvSubnetName "$(appSrvSubnetNamePR)" -intExternalAStoVNet "true" -funcsSubnetName "$(funcsSubnetNamePR)" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)" -ipSecurityRestrictionsEnabled "false"'

     - template: templates\standard-service-pr-ci-build-prinfra-linux.yml
       parameters:
          ProjectName: ${{ variables.ProjectName }}
          ServiceName: ${{ variables.ServiceName }} 
          DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
          ApiFrameworkVersion: 'net8.0'
          ResourceGroup: $(ResourceGroup)
          ServiceBusSettings: $(ServiceBusSettingsPR)
          azureSubscription: '$(azureSubscription)'
          environmentKey: $(EnvironmentKey)
          BuildApi: ${{ variables.BuildApi }}
          BuildFunction: ${{ variables.BuildFunction }}
          SecureSmokeTest: ${{ variables.SecureSmokeTest }}
          SmokeTestTenantId: $(SmokeTestTenantId)
          SmokeTestApplicationUrl: $(SmokeTestApplicationUrl-external)
          SmokeTestClientID: $(SmokeTestClientId-external)
          SmokeTestClientSecret: $(ExternalAzureAdClientSecret)
# ==================================================
# STAGE 3 - INTEGRATION TESTS
# ==================================================

- stage: IntegrationTests
  displayName: Run Integration Tests
  dependsOn: PR_Infra
  condition: and(
    succeeded(),
    eq(variables['Build.Reason'], 'PullRequest'),
    eq(variables['runIntegrationTests'], 'true'))

  jobs:
  - job: RunTests

    steps:
     # ✅ Restore using private feed because Those packages are not public NuGet packages. They're internal CalculateFunding packages hosted in your Azure DevOps Artifacts feed.
    - task: DotNetCoreCLI@2
      displayName: Restore Integration Test Projects
      inputs:
        command: restore
        projects: |
          **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
        feedsToUse: select
        vstsFeed: 'ecf37bc0-472b-47bf-91e3-6774809fd194'

    # ✅ Run Integration Tests
    - task: DotNetCoreCLI@2
      displayName: 'dotnet test for Integration tests'
      inputs:
        command: test
        projects: |
          **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
        # arguments: '--configuration Release /p:AssemblyVersion=$(Build.BuildNumber)'
        arguments: '--filter "FullyQualifiedName!~IntegrationTests"'
      env:
         AzureAd__Audience: $(AzureAdAudienceExternal) 
         AzureAd__Authority: $(AzureAdAuthority)
         AzureAd__TenantId: $(AzureAdTenantId)
         AzureConfiguration__ConnectionString: $(AzureConfigurationConnectionString)
         AzureStorageSettings__ConnectionString: $(AzureStorageSettings)
         CommonStorageSettings__ConnectionString: $(AzureStorageSettings)
         CosmosDbSettings__ConnectionString: $(CosmosDbSettings)
         CosmosDbSettings__ContainerName: 'publishedfunding'
         CosmosDbSettings__DatabaseName: $(CosmosDbSettingsDatabaseName)
         RedisSettings__CacheConnection: $(RedisSettings)
         ResourceGroup: $(ResourceGroup)
         SearchServiceKey: $(SearchServiceKey)
         SearchServiceName: $(SearchServiceName)
         ServiceBusSettings__ConnectionString: $(ServiceBusSettingsPR)
         storageConfiguration__ConnectionString: $(AzureStorageSettings)
         WEBSITE_HTTPLOGGING_CONTAINER_URL: $(WEBSITE_HTTPLOGGING_CONTAINER_URL)
         apiKeyMiddleware__apiKey: $(svcapiexternal)
         cfsClient__ApiEndpoint: $(cfsClientApiEndpoint)
         policiesClient__ApiEndpoint: $(policiesClientApiEndpoint)
         policiesClient__ApiKey: $(svcapipolicy)
         providerProfilingAzureBearerTokenOptions__ClientId: $(providerProfilingAzureBearerTokenOptionsClientId) 
         providerProfilingAzureBearerTokenOptions__ClientSecret: $(providerProfilingAzureBearerTokenClientSecret)
         providerProfilingAzureBearerTokenOptions__GrantType : 'client_credentials'
         providerProfilingAzureBearerTokenOptions__Scope: $(providerProfilingAzureBearerTokenOptionsScope)
         providerProfilingAzureBearerTokenOptions__Url: $(providerProfilingAzureBearerTokenOptionsUrl)
         providerProfilingClient__ApiEndpoint: $(providerProfilingClientApiEndpoint)
         providerProfilingClient__ApiKey: $(svcapiprofiling)
         providersClient__ApiEndpoint: $(providersClientApiEndpoint)
         providersClient__ApiKey: $(svcapiproviders)

    - task: AzureCLI@2
      condition: and(failed(), eq( '${{ variables.BuildApi }}', true), eq(variables['Build.Reason'], 'PullRequest'))
      displayName: 'Reset in-progress swap on failure'
      inputs:
         azureSubscription: $(azureSubscription)
         scriptType: pscore
         scriptLocation: inlineScript
         inlineScript: 'az webapp deployment slot swap --action reset --slot Staging --name app-$(EnvironmentKey)-${{ variables.ServiceName }}-pr --resource-group $(ResourceGroup)'