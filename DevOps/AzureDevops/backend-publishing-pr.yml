name: $(Rev:r)

trigger:
  branches:
    include:
      - providers
      - fdps
      - releases/*
  paths:
    include:
    - CalculateFunding.Api.Publishing
    - CalculateFunding.Functions.Publishing
    - CalculateFunding.Services.Publishing
    - CalculateFunding.Services.Publishing.UnitTests
    - CalculateFunding.Services.Core
    - Devops/search-indexes/publishedfundingindex
    - Devops/search-indexes/publishedproviderindex
    - CalculateFunding.Generators.Schema10
    - CalculateFunding.Generators
    - CalculateFunding.Models.Search
    - CalculateFunding.Models.Versioning
    - CalculateFunding.Models.ProviderLegacy
    - CalculateFunding.Models.Publishing
    - CalculateFunding.Models.External

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: self

variables:
  - name: ProjectName
    value: Publishing

  - name: ServiceName
    value: Publishing

  - name: templateName
    value: publishing

  - name: releaseconfiguration
    value: Release

  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true

  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true

  - name: BuildApi
    value: true

  - name: BuildFunction
    value: true

  - name: SecureSmokeTest
    value: false

  - name: runIntegrationTests
    value: true

  # Docker / ACR
  - name: acrName
    value: cfsdevsharedacr

  - name: acrLoginServer
    value: cfsdevsharedacr.azurecr.io

  - name: dockerRegistryServiceConnection
    value: CFS-DEV-ACR

  - name: imageTag
    value: $(Build.BuildId)

  - name: patToken
    value: $(System.AccessToken)

  # Variable Groups
  - group: Dotnet Core SDK Version
  - group: Azure Settings Integration-v2
  - group: Integration Tests Info - Integration-PR
  - group: Integration Tests KV - Integration-PR
  - group: Shared Infrastructure - Integration - v2
  - group: Resource Tags test-v2 integration-v2
  - group: Feature Toggles Integration-v2

stages:
  # ==================================================
  # STAGE 1 - BUILD & PUSH DOCKER IMAGE(S)
  # ==================================================
  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: DockerBuild
        displayName: Build Docker Images
        condition: succeeded()
        steps:
          - task: Docker@2
            displayName: Build API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: publishing-api
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Api.Publishing/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: publishing-api
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: publishing-function
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Functions.Publishing/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: publishing-function
              tags: |
                $(imageTag)
                latest

  # ==================================================
  # STAGE 2 - PR INFRA + DEPLOY
  # ==================================================
  - stage: PR_Infra
    displayName: Deploy PR Infrastructure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployInfra
        steps:
          - template: templates/standard-service-arm-deploy-linux.yml
            parameters:
              ServiceName: ${{ variables.ServiceName }}
              templateName: ${{ variables.templateName }}
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              overrideParameters: '-environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -environmentKey "$(EnvironmentKey)" -productVersion "pr" -appServiceLogRetentionDays "0" -sendWebLogsToStorage "false" -enableExceptionMessages "false" -FUNCTIONS_EXTENSION_VERSION $(FUNCTIONS_EXTENSION_VERSION_net8) -apiHostingPlanName "$(apiHostingPlanNamePR)" -functionHostingPlanName "$(functionHostingPlanNamePR)" -keyVaultName "$(keyVaultNamePR)" -applicationInsightsName "$(applicationInsightsName)" -sharedLogStorageName "$(sharedLogStorageName)" -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -searchName "$(searchName)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -appSrvSubnetName "$(appSrvSubnetNamePR)" -intPublishingAStoVNet "true" -funcsSubnetName "$(funcsSubnetNamePR)" -intPublishingFAtoVNet "true" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)" -ipSecurityRestrictionsEnabled "false" -ipSecurityRestrictionsEnabledFA "false" -deletePublishedProviderForbidden "false" -providerProfilingApiUrl "$(providerProfilingClientApiEndpoint)" -providerProfilingAzureBearerTokenClientId "$(providerProfilingAzureBearerTokenOptionsClientId)" -providerProfilingAzureBearerTokenGrantType "client_credentials" -providerProfilingAzureBearerTokenScope "$(providerProfilingAzureBearerTokenOptionsScope)" -providerProfilingAzureBearerTokenUrl "$(providerProfilingAzureBearerTokenOptionsUrl)"'

          - template: templates/standard-service-pr-ci-build-prinfra-linux.yml
            parameters:
              ProjectName: ${{ variables.ProjectName }}
              ServiceName: ${{ variables.ServiceName }}
              DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
              ApiFrameworkVersion: net8.0
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              environmentKey: $(EnvironmentKey)
              ServiceBusSettings: $(ServiceBusSettingsPR)
              BuildApi: ${{ variables.BuildApi }}
              BuildFunction: ${{ variables.BuildFunction }}
              SecureSmokeTest: ${{ variables.SecureSmokeTest }}
              APIKey: $(svcapipublishing)

          - task: PublishBuildArtifacts@1
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            displayName: 'Publish Artifact: Call Url Azure AD script'
            inputs:
             PathtoPublish: '$(Build.ArtifactStagingDirectory)/DevOps/call-url-azure-ad.ps1'
             ArtifactName: call-url-aad-script


