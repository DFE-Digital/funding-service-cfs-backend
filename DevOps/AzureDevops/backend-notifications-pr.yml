name: $(Rev:r)

pool:
  vmImage: ubuntu-latest

trigger:
  branches:
    include:
    - master
    - providers
    - fdps
    - releases/*
  paths:
    include:
    - CalculateFunding.Api.Jobs
    - CalculateFunding.Functions.Jobs
    - CalculateFunding.Services.Jobs
    - CalculateFunding.Services.Jobs.UnitTests
    - CalculateFunding.Services.Core
    - CalculateFunding.Services.Notifications
    - CalculateFunding.Api.Notifications
    - CalculateFunding.Functions.Notifications
    - CalculateFunding.Functions.Notifications.UnitTests
    - CalculateFunding.Services.Notifications.UnitTests
    - CalculateFunding.Models.Jobs

variables:
 - name: ProjectName
   value: Notifications

 - name: ServiceName
   value: Notifications

 - name: templateName
   value: notifications

 - name: releaseconfiguration
   value: 'release'

 - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
   value: true
 - name: DOTNET_CLI_TELEMETRY_OPTOUT 
  
   value: true
 - name: BuildApi
  
   value: false
 - name: BuildFunction
   value: true

 - name: SecureSmokeTest
   value: false

  # Docker / ACR
 - name: acrName
   value: cfsdevsharedacr

 - name: acrLoginServer
   value: cfsdevsharedacr.azurecr.io

 - name: dockerRegistryServiceConnection
   value: CFS-DEV-ACR

 - name: imageTag
   value: $(Build.BuildId)

 - name: patToken
   value: $(System.AccessToken)

  # Variable Groups
 - group: 'Dotnet Core SDK Version'
 - group: 'Azure Settings Integration-v2'
 - group: 'Integration Tests Info - Integration-PR' 
 - group: 'Integration Tests KV - Integration-PR'
 - group: 'Shared Infrastructure - Integration - v2'
 - group: 'Resource Tags test-v2 integration-v2'
 - group: 'Feature Toggles Integration-v2'

stages:
  # ==================================================
  # STAGE 1 - BUILD & PUSH DOCKER IMAGE(S)
  # ==================================================
  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: DockerBuild
        displayName: Build Docker Images
        condition: succeeded()
        steps:        
          - task: Docker@2
            displayName: Build Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: notifications-function
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Functions.Notifications/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: notifications-function
              tags: |
                $(imageTag)
                latest

  # ==================================================
  # STAGE 2 - PR INFRA + DEPLOY
  # ==================================================
  - stage: PR_Infra
    displayName: Deploy PR Infrastructure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployInfra
        steps:
          - template: templates/standard-service-arm-deploy-linux.yml
            parameters:
              ServiceName: ${{ variables.ServiceName }}
              templateName: ${{ variables.templateName }}
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              overrideParameters: '-environmentKey "$(EnvironmentKey)" -productVersion "pr" -enableExceptionMessages "false" -FUNCTIONS_EXTENSION_VERSION "~4" -functionHostingPlanName "$(functionHostingPlanNamePR)" -keyVaultName "$(keyVaultNamePR)" -environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -applicationInsightsName "$(applicationInsightsName)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -funcsSubnetName "$(funcsSubnetNamePR)" -intNotificationsFAtoVNet "true" -ipSecurityRestrictionsEnabledFA "false" -appSrvSubnetName "$(appSrvSubnetNamePR)" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)"'

          - template: templates/standard-service-pr-ci-build-prinfra-linux.yml
            parameters:
              ProjectName: ${{ variables.ProjectName }}
              ServiceName: ${{ variables.ServiceName }}
              DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
              ApiFrameworkVersion: net8.0
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              environmentKey: $(EnvironmentKey)
              ServiceBusSettings: $(ServiceBusSettingsPR)
              BuildApi: ${{ variables.BuildApi }}
              BuildFunction: ${{ variables.BuildFunction }}
              SecureSmokeTest: ${{ variables.SecureSmokeTest }}