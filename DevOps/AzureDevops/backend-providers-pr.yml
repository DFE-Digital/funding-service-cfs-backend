name: $(Rev:r)

pool:
  vmImage: ubuntu-latest

trigger:
  branches:
    include:
    - providers
    - fdps
    - releases/*
  paths:
    include:
    - CalculateFunding.Api.Providers
    - CalculateFunding.Functions.Providers
    - CalculateFunding.Services.Providers
    - CalculateFunding.Services.Providers.UnitTests
    - CalculateFunding.Services.Core
    - DevOps/search-indexes/providersindex
    - DevOps/search-indexers/providersindexer
    - CalculateFunding.Models.Providers
    - DevOps/provider-storage
    - DevOps/search-datasources/providersdatasource
    - CalculateFunding.Models.ProviderLegacy

variables:
 - name: ProjectName
   value: 'Providers'
 - name: ServiceName
   value: 'Providers'
 - name: templateName
   value: providers
 - name: releaseconfiguration
   value: 'release'
 - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
   value: true
 - name: DOTNET_CLI_TELEMETRY_OPTOUT 
   value: true
 - name: BuildApi
   value: true
 - name: BuildFunction
   value: true
 - name: SecureSmokeTest
   value: false
   
 # Docker / ACR
 - name: acrName
   value: cfsdevsharedacr

 - name: acrLoginServer
   value: cfsdevsharedacr.azurecr.io

 - name: dockerRegistryServiceConnection
   value: CFS-DEV-ACR

 - name: imageTag
   value: $(Build.BuildId)

 - name: patToken
   value: $(System.AccessToken)  
   
 - group: 'Dotnet Core SDK Version'
 - group: 'Azure Settings Integration-v2'
 - group: 'Integration Tests Info - Integration-PR' 
 - group: 'Integration Tests KV - Integration-PR'
 - group: 'Shared Infrastructure - Integration - v2'
 - group: 'Resource Tags test-v2 integration-v2'
 - group: 'Feature Toggles Integration-v2'
 - group: 'SPI Dev'


# ==================================================
# STAGE 1 - BUILD & PUSH DOCKER IMAGES
# ==================================================

stages:
- stage: Build
  displayName: Build and Push Images

  jobs:
  - job: DockerBuild
    displayName: Build Docker Images
    condition: succeeded()
    steps:
    - task: Docker@2
      displayName: Build API Image
      condition: eq(variables['BuildApi'], 'true')
      inputs:
        command: build
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: providers-api
        Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Api.Providers/Dockerfile
        buildContext: $(Build.SourcesDirectory)
        arguments: >
          --build-arg FEED_PAT=$(patToken)
        tags: |
          $(imageTag)
          latest

    - task: Docker@2
      displayName: Push API Image
      condition: eq(variables['BuildApi'], 'true')
      inputs:
        command: push
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: providers-api
        tags: |
          $(imageTag)
          latest


    - task: Docker@2
      displayName: Build Function Image
      condition: eq(variables['BuildFunction'], 'true')
      inputs:
        command: build
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: providers-function
        dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Functions.Providers/Dockerfile
        buildContext: $(Build.SourcesDirectory)
        arguments: >
          --build-arg FEED_PAT=$(patToken)
        tags: |
          $(imageTag)
          latest

    - task: Docker@2
      displayName: Push Function Image
      condition: eq(variables['BuildFunction'], 'true')
      inputs:
        command: push
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: providers-function
        tags: |
          $(imageTag)
          latest


# ==================================================
# STAGE 2 - PR INFRA + DEPLOY
# ==================================================

- stage: PR_Infra
  displayName: Deploy PR Infrastructure
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployInfra

    steps:
     - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
       - template: templates\standard-service-arm-deploy-linux.yml
         parameters:
           ServiceName: ${{ variables.ServiceName }}
           ResourceGroup: $(ResourceGroup)
           azureSubscription: $(azureSubscription)
           templateName : $(templateName)
           overrideParameters: '-environmentKey "$(EnvironmentKey)" -productVersion "pr" -appServiceLogRetentionDays "0" -sendWebLogsToStorage "false" -enableExceptionMessages "false" -FUNCTIONS_EXTENSION_VERSION $(FUNCTIONS_EXTENSION_VERSION_Net6) -apiHostingPlanName "$(apiHostingPlanNamePR)" -functionHostingPlanName "$(functionHostingPlanNamePR)" -keyVaultName "$(keyVaultNamePR)" -environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -applicationInsightsName "$(applicationInsightsName)" -sharedLogStorageName "$(sharedLogStorageName)" -searchName $(searchName) -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -azureAdTenantId "$(azureAdTenantId)" -azureAdAudienceExternal "$(azureAdAudienceExternal)" -spiClientApiEndpoint "$(spiClientApiEndpoint)" -spiAzureBearerTokenOptionsUrl "$(spiAzureBearerTokenOptionsUrl)" -spiAzureBearerTokenOptionsGrantType "$(spiAzureBearerTokenOptionsGrantType)" -spiAzureBearerTokenOptionsScope "$(spiAzureBearerTokenOptionsScope)" -spiAzureBearerTokenOptionsClientId "$(spiAzureBearerTokenOptionsClientId)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -appSrvSubnetName "$(appSrvSubnetNamePR)" -intProvidersAStoVNet "true" -funcsSubnetName "$(funcsSubnetNamePR)" -intProvidersFAtoVNet "true" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)" -ipSecurityRestrictionsEnabled "false" -ipSecurityRestrictionsEnabledFA "false" -UseSQLDB "false"'

     - template: templates\standard-service-pr-ci-build-prinfra-linux.yml
       parameters:
         ProjectName: ${{ variables.ProjectName }}
         ServiceName: ${{ variables.ServiceName }} 
         DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
         ApiFrameworkVersion: 'net8.0'
         ResourceGroup: $(ResourceGroup)
         azureSubscription: '$(azureSubscription)'
         environmentKey: $(EnvironmentKey)
         ServiceBusSettings: $(ServiceBusSettingsPR)
         BuildApi: ${{ variables.BuildApi }}
         BuildFunction: ${{ variables.BuildFunction }}
         SecureSmokeTest: ${{ variables.SecureSmokeTest }}
         APIKey: $(svcapiproviders)

# ==================================================
# STAGE 3 - INTEGRATION TESTS
# ==================================================

- stage: IntegrationTests
  displayName: Run Integration Tests
  dependsOn: PR_Infra
  condition: and(
    succeeded(),
    eq(variables['Build.Reason'], 'PullRequest'),
    eq(variables['runIntegrationTests'], 'true'))

  jobs:
  - job: RunTests

    steps:
     # ✅ Restore using private feed because Those packages are not public NuGet packages. They're internal CalculateFunding packages hosted in your Azure DevOps Artifacts feed.
    - task: DotNetCoreCLI@2
      displayName: Restore Integration Test Projects
      inputs:
        command: restore
        projects: |
          **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
        feedsToUse: select
        vstsFeed: 'ecf37bc0-472b-47bf-91e3-6774809fd194'

    # ✅ Run Integration Tests
    - task: DotNetCoreCLI@2
      displayName: 'dotnet test for Integration tests'
      inputs:
        command: test
        projects: |
          **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
        # arguments: '--configuration Release /p:AssemblyVersion=$(Build.BuildNumber)'
        arguments: '--filter "FullyQualifiedName!~IntegrationTests"'
      env:
         AzureAd__Audience: $(AzureAdAudienceExternal) 
         AzureAd__Authority: $(AzureAdAuthority)
         AzureAd__TenantId: $(AzureAdTenantId)
         AzureConfiguration__ConnectionString: $(AzureConfigurationConnectionString)
         AzureStorageSettings__ConnectionString: $(AzureStorageSettings)
         CommonStorageSettings__ConnectionString: $(AzureStorageSettings)
         CosmosDbSettings__ConnectionString: $(CosmosDbSettings)
         CosmosDbSettings__DatabaseName: $(CosmosDbSettingsDatabaseName)
         RedisSettings__CacheConnection: $(RedisSettings)
         ResourceGroup: $(ResourceGroup)
         SearchServiceKey: $(SearchServiceKey)
         SearchServiceName: $(SearchServiceName)
         ServiceBusSettings__ConnectionString: $(ServiceBusSettingsPR)
         storageConfiguration__ConnectionString: $(AzureStorageSettings)
         WEBSITE_HTTPLOGGING_CONTAINER_URL: $(WEBSITE_HTTPLOGGING_CONTAINER_URL)
         apiKeyMiddleware__apiKey: $(svcapiproviders)
         cfsClient__ApiEndpoint: $(cfsClientApiEndpoint)
         jobsClient__ApiEndpoint: $(jobsClientApiEndpoint)
         jobsClient__ApiKey: $(svcapijobs)
         policiesClient__ApiEndpoint: $(policiesClientApiEndpoint)
         policiesClient__ApiKey: $(svcapipolicy)
         providersClient__ApiEndpoint: $(providersClientApiEndpoint)
         providersClient__ApiKey: $(svcapiproviders)
         resultsClient__ApiEndpoint: $(resultsClientApiEndpoint)
         resultsClient__ApiKey: $(svcapiresults)
         specificationsClient__ApiEndpoint: $(specificationsClientApiEndpoint)
         specificationsClient__ApiKey: $(svcapispecs)
         spiAzureBearerTokenOptions__ClientId: $(spiAzureBearerTokenOptionsClientId)
         spiAzureBearerTokenOptions__ClientSecret: $(spiAzureBearerTokenOptionsClientSecret)
         spiAzureBearerTokenOptions__GrantType: 'client_credentials'
         spiAzureBearerTokenOptions__Scope: $(spiAzureBearerTokenOptionsScope)
         spiAzureBearerTokenOptions__Url: $(spiAzureBearerTokenOptionsUrl)
         spiClient__ApiEndpoint: $(spiClientApiEndpoint) 
         spiClient__ApiKey: $(spiClientApiKey)


    - task: AzureCLI@2
      condition: and(failed(), eq(variables['Build.Reason'], 'PullRequest'))
      displayName: 'Reset in-progress swap on failure'
      inputs:
         azureSubscription: $(azureSubscription)
         scriptType: pscore
         scriptLocation: inlineScript
         inlineScript: 'az webapp deployment slot swap --action reset --slot Staging --name app-$(EnvironmentKey)-${{ variables.ServiceName }}-pr --resource-group $(ResourceGroup)'
         
         
