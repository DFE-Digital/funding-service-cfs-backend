name: $(Rev:r)

trigger:
  branches:
    include:
      - master
      - providers
      - fdps
      - releases/*
  paths:
    include:
      - CalculateFunding.Api.Calcs
      - CalculateFunding.Functions.Calcs
      - CalculateFunding.Services.Calcs
      - CalculateFunding.Services.Calcs.UnitTests
      - CalculateFunding.Services.Core
      - Devops/search-indexes/calculationindex
      - CalculateFunding.Services.CodeGeneration
      - CalculateFunding.Services.CodeGeneration.VisualBasic
      - CalculateFunding.Services.CodeMetadataGenerator
      - CalculateFunding.Models.Calcs
      - CalculateFunding.Models.Search
      - CalculateFunding.Models.Versioning
      - CalculateFunding.Models.ProviderLegacy
      - DevOps/azure/calcs

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: self

variables:
  - name: ProjectName
    value: Calcs

  - name: ServiceName
    value: Calcs

  - name: templateName
    value: calcs

  - name: releaseconfiguration
    value: Release

  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true

  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true

  - name: BuildApi
    value: true

  - name: BuildFunction
    value: true

  - name: SecureSmokeTest
    value: false

  - name: runIntegrationTests
    value: true

  # Docker / ACR
  - name: acrName
    value: cfsdevsharedacr

  - name: acrLoginServer
    value: cfsdevsharedacr.azurecr.io

  - name: dockerRegistryServiceConnection
    value: CFS-DEV-ACR

  - name: imageTag
    value: $(Build.BuildId)

  - name: patToken
    value: $(System.AccessToken)

  # Variable Groups
  - group: Dotnet Core SDK Version
  - group: Azure Settings Integration-v2
  - group: Integration Tests Info - Integration-PR
  - group: Integration Tests KV - Integration-PR
  - group: Shared Infrastructure - Integration - v2
  - group: Resource Tags test-v2 integration-v2
  - group: Feature Toggles Integration-v2

stages:
  # ==================================================
  # STAGE 1 - BUILD & PUSH DOCKER IMAGE(S)
  # ==================================================
  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: DockerBuild
        displayName: Build Docker Images
        condition: succeeded()
        steps:
          - task: Docker@2
            displayName: Build API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: calcs-api
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Api.Calcs/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: calcs-api
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: calcs-function
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Functions.Calcs/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: calcs-function
              tags: |
                $(imageTag)
                latest

  # ==================================================
  # STAGE 2 - PR INFRA + DEPLOY
  # ==================================================
  - stage: PR_Infra
    displayName: Deploy PR Infrastructure
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployInfra
        steps:
          - template: templates/standard-service-arm-deploy-linux.yml
            parameters:
              ServiceName: ${{ variables.ServiceName }}
              templateName: ${{ variables.templateName }}
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              overrideParameters: '-environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -environmentKey "$(EnvironmentKey)" -productVersion "pr" -appServiceLogRetentionDays "0" -sendWebLogsToStorage "false" -enableExceptionMessages "false" -FUNCTIONS_EXTENSION_VERSION $(FUNCTIONS_EXTENSION_VERSION_net8) -apiHostingPlanName "$(apiHostingPlanNamePR)" -functionHostingPlanName "$(functionHostingPlanNamePR)" -keyVaultName "$(keyVaultNamePR)" -sharedLogStorageName "$(sharedLogStorageName)" -searchName "$(searchName)" -enableProcessDatasetDefinitionFieldChanges "$(EnableProcessDatasetDefinitionFieldChanges)" -calcEngineMaxPartitionSize "$(calcEngineMaxPartitionSize)" -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -applicationInsightsName "$(applicationInsightsName)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -appSrvSubnetName "$(appSrvSubnetNamePR)" -intCalcsAStoVNet "true" -funcsSubnetName "$(funcsSubnetNamePR)" -intCalcsFAtoVNet "true" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)" -ipSecurityRestrictionsEnabled "false" -ipSecurityRestrictionsEnabledFA "false" -UseSQLDB "false"'

          - template: templates/standard-service-pr-ci-build-prinfra-linux.yml
            parameters:
              ProjectName: ${{ variables.ProjectName }}
              ServiceName: ${{ variables.ServiceName }}
              DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
              ApiFrameworkVersion: net8.0
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              environmentKey: $(EnvironmentKey)
              ServiceBusSettings: $(ServiceBusSettingsPR)
              BuildApi: ${{ variables.BuildApi }}
              BuildFunction: ${{ variables.BuildFunction }}
              SecureSmokeTest: ${{ variables.SecureSmokeTest }}
              APIKey: $(svcapicalcs)

  # ==================================================
  # STAGE 3 - INTEGRATION TESTS
  # ==================================================
  - stage: IntegrationTests
    displayName: Run Integration Tests
    dependsOn: PR_Infra
    condition: and(
      succeeded(),
      eq(variables['Build.Reason'], 'PullRequest'),
      eq(variables['runIntegrationTests'], 'true'))
    jobs:
      - job: RunTests
        steps:
          - task: PowerShell@2
            displayName: Get Outbound IP
            name: GetAgentIP
            inputs:
              targetType: inline
              script: |
                $ip = Invoke-RestMethod -Uri "https://api.ipify.org"
                Write-Host "##vso[task.setvariable variable=agentIp;]$ip"
                Write-Host "Agent public IP: $ip"

          - task: AzureCLI@2
            displayName: Add IP to Storage Account Firewall
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                az storage account network-rule add --resource-group "$(ResourceGroup)" --account-name "$(sharedStorageName)" --ip-address "$(agentIp)"

          - task: PowerShell@2
            displayName: Wait before running integration tests
            inputs:
              targetType: inline
              script: |
                Write-Host "Waiting for 15 seconds to allow background job to start..."
                Start-Sleep -Seconds 15

          - task: DotNetCoreCLI@2
            displayName: Restore Integration Test Projects
            inputs:
              command: restore
              projects: |
                  **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
              feedsToUse: select                 
              vstsFeed: 'ecf37bc0-472b-47bf-91e3-6774809fd194'

          - task: DotNetCoreCLI@2
            displayName: dotnet test for Integration tests
            condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), eq(variables['runIntegrationTests'], 'true'))
            inputs:
              command: test
              projects: |
                **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
              arguments: '--configuration Release /p:AssemblyVersion=$(Build.BuildNumber)'
            env:
              AzureConfiguration__ConnectionString: $(AzureConfigurationConnectionString)
              AzureStorageSettings__ConnectionString: $(AzureStorageSettings)
              CommonStorageSettings__ConnectionString: $(AzureStorageSettings)
              CosmosDbSettings__ConnectionString: $(CosmosDbSettings)
              CosmosDbSettings__ContainerName: calcs
              CosmosDbSettings__DatabaseName: $(CosmosDbSettingsDatabaseName)
              RedisSettings__CacheConnection: $(RedisSettings)
              ResourceGroup: $(ResourceGroup)
              SearchServiceKey: $(SearchServiceKey)
              SearchServiceName: $(SearchServiceName)
              ServiceBusSettings__ConnectionString: $(ServiceBusSettingsPR)
              storageConfiguration__ConnectionString: $(AzureStorageSettings)
              WEBSITE_HTTPLOGGING_CONTAINER_URL: $(WEBSITE_HTTPLOGGING_CONTAINER_URL)
              apiKeyMiddleware__apiKey: $(svcapicalcs)
              cfsClient__ApiEndpoint: $(cfsClientApiEndpoint)
              calcsClient__ApiEndpoint: $(calcsClientApiEndpoint)
              calcsClient__ApiKey: $(svcapicalcs)
              calcEngineClient__ApiEndpoint: $(calcEngineClientApiEndpoint)
              calcEngineClient__ApiKey: $(svcapicalcengine)
              datasetsClient__ApiEndpoint: $(datasetsClientApiEndpoint)
              datasetsClient__ApiKey: $(svcapidatasets)
              graphClient__ApiEndpoint: $(graphClientApiEndpoint)
              graphClient__ApiKey: $(svcapigraph)
              jobsClient__ApiEndpoint: $(jobsClientApiEndpoint)
              jobsClient__ApiKey: $(svcapijobs)
              policiesClient__ApiEndpoint: $(policiesClientApiEndpoint)
              policiesClient__ApiKey: $(svcapipolicy)
              providersClient__ApiEndpoint: $(providersClientApiEndpoint)
              providersClient__ApiKey: $(svcapiproviders)
              resultsClient__ApiEndpoint: $(resultsClientApiEndpoint)
              resultsClient__ApiKey: $(svcapiresults)
              specificationsClient__ApiEndpoint: $(specificationsClientApiEndpoint)
              specificationsClient__ApiKey: $(svcapispecs)

          - task: AzureCLI@2
            displayName: Remove IP from Storage Account Firewall
            condition: always()
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                az storage account network-rule remove --resource-group "$(ResourceGroup)" --account-name "$(sharedStorageName)" --ip-address "$(agentIp)"

          - task: AzureCLI@2
            condition: and(failed(), eq(variables['Build.Reason'], 'PullRequest'))
            displayName: Reset in-progress swap on failure
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: 'az webapp deployment slot swap --action reset --slot Staging --name app-$(EnvironmentKey)-${{ variables.ServiceName }}-pr --resource-group $(ResourceGroup)'