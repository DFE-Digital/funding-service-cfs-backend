name: $(Rev:r)

trigger:
  branches:
    include:
      - master
      - providers
      - fdps
      - releases/*
  paths:
    include:
      - CalculateFunding.Services.CosmosDbScaling
      - CalculateFunding.Services.CosmosDbScaling.UnitTests
      - CalculateFunding.Services.Core
      - CalculateFunding.Functions.CosmosDbScaling
      - CalculateFunding.Models.CosmosDbScaling
      - CalculateFunding.Api.CosmosDbScaling

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: self

variables:
  - name: ProjectName
    value: CosmosDbScaling

  - name: ServiceName
    value: Cosmosscaling

  - name: templateName
    value: cosmosScaling

  - name: releaseconfiguration
    value: Release

  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true

  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true

  - name: BuildApi
    value: true

  - name: BuildFunction
    value: true

  - name: SecureSmokeTest
    value: false

  - name: runIntegrationTests
    value: true

  # Docker / ACR
  - name: acrName
    value: cfsdevsharedacr
  - name: acrLoginServer
    value: cfsdevsharedacr.azurecr.io
  - name: dockerRegistryServiceConnection
    value: CFS-DEV-ACR
  - name: imageTag
    value: $(Build.BuildId)
  - name: patToken
    value: $(System.AccessToken)

  # Variable Groups
  - group: Dotnet Core SDK Version
  - group: Azure Settings Integration-v2
  - group: Integration Tests Info - Integration-PR
  - group: Integration Tests KV - Integration-PR
  - group: Shared Infrastructure - Integration - v2
  - group: Resource Tags test-v2 integration-v2
  - group: Feature Toggles Integration-v2

# ==================================================
# STAGE 1 - BUILD & PUSH DOCKER IMAGES
# ==================================================

stages:
  - stage: Build
    displayName: Build and Push Images
    jobs:
      - job: DockerBuild
        displayName: Build Docker Images
        condition: succeeded()
        steps:
          - task: Docker@2
            displayName: Build API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: cosmosscaling-api
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Api.CosmosDbScaling/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push API Image
            condition: eq(variables['BuildApi'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: cosmosscaling-api
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: cosmosscaling-function
              Dockerfile: $(Build.SourcesDirectory)/CalculateFunding.Functions.CosmosDbScaling/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              arguments: >
                --build-arg FEED_PAT=$(patToken)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push Function Image
            condition: eq(variables['BuildFunction'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: cosmosscaling-function
              tags: |
                $(imageTag)
                latest

# ==================================================
# STAGE 2 - PR INFRA + DEPLOY
# ==================================================

  - stage: PR_Infra
    displayName: Deploy PR Infrastructure
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: DeployInfra
        steps:
          - template: templates\standard-service-arm-deploy-linux.yml
            parameters:
              ServiceName: ${{ variables.ServiceName }}
              templateName : ${{ variables.templateName }}
              ResourceGroup: $(ResourceGroup)
              azureSubscription: $(azureSubscription)
              overrideParameters: '-environmentKey "$(EnvironmentKey)" -productVersion "pr" -appServiceLogRetentionDays "0" -sendWebLogsToStorage "false" -enableExceptionMessages "false" -FUNCTIONS_EXTENSION_VERSION $(FUNCTIONS_EXTENSION_VERSION_net8) -apiHostingPlanName $(apiHostingPlanNamePR) -functionHostingPlanName $(functionHostingPlanNamePR) -keyVaultName $(keyVaultNamePR) -sharedLogStorageName $(sharedLogStorageName) -environmentTag "$(environmentTag)" -parentBusinessTag "$(parentBusinessTag)" -portfolioTag "$(portfolioTag)" -productTag "$(productTag)" -serviceLineTag "$(serviceLineTag)" -Http5xxTH "100" -Http401TH "100" -HttpResponseTimeTH "100" -applicationInsightsName "$(applicationInsightsName)" -logAnalyticsWorkspaceName "$(logAnalyticsWorkspaceName)" -eventHubInstanceName "$(eventHubInstanceName)" -dfeT1VNetResourceGroupName "$(dfeT1VNetResourceGroupName)" -dfeT1VirtualNetworkName "$(dfeT1VirtualNetworkName)" -appSrvSubnetName "$(appSrvSubnetNamePR)" -intCosmosScalingAStoVNet "true" -funcsSubnetName "$(funcsSubnetNamePR)" -intCosmosScalingFAtoVNet "true" -calcEngineFASubnetName "$(calcEngineFASubnetNamePR)" -ipSecurityRestrictionsEnabled "false" -ipSecurityRestrictionsEnabledFA "false" -disablingCosmoScalingFA "false"'
          - template: templates\standard-service-pr-ci-build-prinfra-linux.yml
            parameters:
              ProjectName: ${{ variables.ProjectName }}
              ServiceName: ${{ variables.ServiceName }}
              DotnetCoreSdkVersion: $(DotnetCoreSdkVersionNet8)
              ApiFrameworkVersion: net8.0
              ResourceGroup: $(ResourceGroup)
              ServiceBusSettings: $(ServiceBusSettingsPR)
              azureSubscription: $(azureSubscription)
              environmentKey: $(EnvironmentKey)
              BuildApi: ${{ variables.BuildApi }}
              BuildFunction: ${{ variables.BuildFunction }}
              SecureSmokeTest: ${{ variables.SecureSmokeTest }}
              APIKey: $(svcapicosmosdbscaling)

# ==================================================
# STAGE 3 - INTEGRATION TESTS
# ==================================================

  - stage: IntegrationTests
    displayName: Run Integration Tests
    dependsOn: PR_Infra
    condition: and(
      succeeded(),
      eq(variables['Build.Reason'], 'PullRequest'),
      eq(variables['runIntegrationTests'], 'true'))

    jobs:
      - job: RunTests
        displayName: Run Integration Tests
        steps:
          - task: DotNetCoreCLI@2
            displayName: Restore Integration Test Projects
            inputs:
              command: restore
              projects: |
                **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
              feedsToUse: select
              vstsFeed: 'ecf37bc0-472b-47bf-91e3-6774809fd194'

          - task: DotNetCoreCLI@2
            condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), eq(variables.runIntegrationTests, true))
            displayName: dotnet test for Integration tests
            inputs:
              command: test
              projects: |
                **/*Api.${{ variables.ProjectName }}.IntegrationTests/*.csproj
              arguments: '--configuration Release /p:AssemblyVersion=$(Build.BuildNumber)'
            env:
              AzureConfiguration__ConnectionString: $(AzureConfigurationConnectionString)
              AzureStorageSettings__ConnectionString: $(AzureStorageSettings)
              CommonStorageSettings__ConnectionString: $(AzureStorageSettings)
              CosmosDbSettings__ConnectionString: $(CosmosDbSettings)
              CosmosDbSettings__ContainerName: 'cosmosscalingconfig'
              CosmosDbSettings__DatabaseName: $(CosmosDbSettingsDatabaseName)
              ResourceGroup: $(ResourceGroup)
              ServiceBusSettings__ConnectionString: $(ServiceBusSettingsPR)
              storageConfiguration__ConnectionString: $(AzureStorageSettings)
              WEBSITE_HTTPLOGGING_CONTAINER_URL: $(WEBSITE_HTTPLOGGING_CONTAINER_URL)
              apiKeyMiddleware__apiKey: $(svcapicosmosdbscaling)
              cfsClient__ApiEndpoint: $(cfsClientApiEndpoint)
              cosmosdbscalingClient__ApiEndpoint: $(cosmosdbscalingClientApiEndpoint)
              cosmosdbscalingClient__ApiKey: $(svcapicosmosdbscaling)
              jobsClient__ApiEndpoint: $(jobsClientApiEndpoint)
              jobsClient__ApiKey: $(svcapijobs)
          - task: AzureCLI@2
            condition: and(failed(), eq(variables['Build.Reason'], 'PullRequest'))
            displayName: Reset in-progress swap on failure
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: 'az webapp deployment slot swap --action reset --slot Staging --name app-$(EnvironmentKey)-${{ variables.ServiceName }}-pr --resource-group $(ResourceGroup)'